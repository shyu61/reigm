[project]
name = "reigm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "boto3>=1.42.97",
    "click>=8.3.3",
    "curl-cffi>=0.15.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
